  <style>
    html, body { height: 100%; overflow: hidden; }
    .entry { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; background: #050506; transition: opacity .7s ease, transform .7s ease; }
    .entry.is-leaving { opacity: 0; transform: scale(1.04); pointer-events: none; }
    .entry__cone { position: absolute; left: 50%; top: -10vh; width: 70vw; height: 120vh; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.16), rgba(255,255,255,.04) 35%, rgba(0,0,0,0) 62%); pointer-events: none; }
    .entry__floor { position: absolute; left: 0; right: 0; bottom: 0; height: 38vh; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(255,255,255,.035)); pointer-events: none; }
    .entry__inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
    .emblem--entry { width: min(270px, 44vw); animation: entryIn 1.4s .3s both; }
    .emblem--entry img { filter: drop-shadow(0 40px 60px rgba(0,0,0,.9)) drop-shadow(0 0 40px rgba(255,255,255,.12)); }
    .entry__reflet { width: min(270px, 44vw); height: 110px; overflow: hidden; margin-top: -6px; transform: scaleY(-1); opacity: .14; -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0) 45%, #000 100%); mask-image: linear-gradient(180deg, rgba(0,0,0,0) 45%, #000 100%); pointer-events: none; }
    .entry__reflet img { width: 100%; height: auto; filter: blur(1px); transform: translateY(calc(-100% + 110px)); }
    .entry__name { margin: 6px 0 0; font-size: 12px; letter-spacing: .5em; color: var(--ink2); animation: entryIn 1.4s .45s both; }
    .entry__title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .entry__btn { margin-top: 34px; font-family: var(--caps); font-size: 12px; letter-spacing: .42em; text-transform: uppercase; color: var(--silver); border-bottom: 1px solid rgba(214,214,219,.5); padding-bottom: 8px; transition: .3s; animation: entryIn 1.4s .6s both; }
    .entry__btn:hover, .entry__btn:focus-visible { color: #fff; border-color: #fff; letter-spacing: .5em; outline: none; }
    .entry__small { position: absolute; bottom: 22px; left: 0; right: 0; z-index: 2; font-size: 10px; letter-spacing: .3em; color: var(--mute); }
    @keyframes entryIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @media (max-height: 700px) { .emblem--entry, .entry__reflet { width: min(200px, 40vw); } .entry__reflet { height: 70px; } .entry__reflet img { transform: translateY(calc(-100% + 70px)); } }
    @media (prefers-reduced-motion: reduce) { .emblem--entry, .entry__name, .entry__btn { animation: none; } }
  </style>

<body>
<div class="grain" aria-hidden="true"></div>
<main class="entry" id="entry">
  <div class="entry__cone" aria-hidden="true"></div><div class="entry__floor" aria-hidden="true"></div>
  <div class="entry__inner">
    <div class="emblem emblem--entry"><img src="logo-m-rond.webp" alt="Monogramme de la Famille Moni" width="768" height="768" id="m-img"><canvas id="m3d" aria-hidden="true"></canvas></div>
    <div class="entry__reflet" aria-hidden="true"><img src="logo-m-rond.webp" alt=""></div>
    <h1 class="entry__title">La Famille Moni</h1>
    <p class="entry__name caps">La Famille Moni</p>
    <a class="entry__btn" href="accueil.html" id="enter">Entrer</a>
  </div>
  <p class="entry__small caps"><a href="espace-membre.html">Espace membre</a> · Roxwood · Flashback FA</p>
</main>
<script>
  document.getElementById('enter').addEventListener('click', function (e) {
    e.preventDefault();
    try { sessionStorage.setItem('moni-entered', '1'); } catch (er) {}
    document.getElementById('entry').classList.add('is-leaving');
    setTimeout(function () { location.href = 'accueil.html'; }, 650);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('enter').click(); });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var em = document.querySelector('.emblem');
    addEventListener('pointermove', function (e) {
      em.style.setProperty('--tx', (e.clientX / innerWidth - 0.5).toFixed(3));
      em.style.setProperty('--ty', (e.clientY / innerHeight - 0.5).toFixed(3));
    }, { passive: true });
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="logo3d.js?v=4"></script>
<script>monogramme3D(document.getElementById('m3d'), { fallback: document.getElementById('m-img'), scale: 3.4, camZ: 7.2, exposure: 1.15 });</script>
