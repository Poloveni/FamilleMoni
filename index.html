  <style>
    html, body { height: 100%; overflow: hidden; }
    .entry { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px;
      background: radial-gradient(ellipse at 50% 45%, #1c1c20 0%, #0c0c0e 60%, #050506 100%); transition: opacity .7s ease, transform .7s ease; }
    .entry.is-leaving { opacity: 0; transform: scale(1.04); pointer-events: none; }
    .entry__inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
    .entry__eyebrow { font-size: 12px; letter-spacing: .38em; color: var(--ink2); animation: entryIn 1.4s .3s both; }
    .entry__title { font-size: clamp(46px, 8vw, 92px); line-height: .95; margin-top: 12px; text-shadow: 0 6px 30px rgba(0,0,0,.8); animation: entryIn 1.4s .45s both; }
    .entry__motto { font-size: 13px; letter-spacing: .34em; color: #c9c9cf; margin: 20px 0 34px; animation: entryIn 1.4s .6s both; }
    .entry__motto i { font-style: normal; opacity: .45; margin: 0 8px; }
    .entry__btn { animation: entryIn 1.4s .8s both; height: 56px; padding: 0 48px; letter-spacing: .34em; }
    .entry__small { position: absolute; bottom: 22px; left: 0; right: 0; z-index: 2; font-size: 10px; letter-spacing: .3em; color: var(--mute); }
    .emblem--entry { width: min(300px, 46vw); margin-bottom: 6vh; animation: entryIn 1.6s both; }
    @keyframes entryIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @media (max-height: 760px) { .emblem--entry { width: min(220px, 40vw); margin-bottom: 3vh; } }
    @media (max-width: 720px) { .emblem--entry { width: min(200px, 42vw); } }
    @media (prefers-reduced-motion: reduce) { .emblem--entry, .entry__eyebrow, .entry__title, .entry__motto, .entry__btn { animation: none; } }
  </style>
  <script data-goatcounter="https://famillemoni.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="entry" id="entry">
  <div class="entry__inner">
    <div class="emblem emblem--entry"><i class="ring r1"></i><i class="ring r2"></i><img src="logo-m.png" alt="Monogramme de la Famille Moni" width="558" height="760"></div>
    <p class="entry__eyebrow caps">Roxwood · Flashback FA</p>
    <h1 class="entry__title">La Famille <span class="silver">Moni</span></h1>
    <p class="entry__motto caps">Silence <i>·</i> Loyauté <i>·</i> Famiglia</p>
    <a class="btn btn-metal entry__btn" href="accueil.html" id="enter">Entrer</a>
  </div>
  <p class="entry__small caps"><a href="espace-membre.html">Espace membre</a> · Roleplay sur Flashback FA</p>
</main>
<script>
  document.getElementById('enter').addEventListener('click', function (e) {
    e.preventDefault();
    try { sessionStorage.setItem('moni-entered', '1'); } catch (er) {}
    document.getElementById('entry').classList.add('is-leaving');
    setTimeout(function () { location.href = 'accueil.html'; }, 650);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('enter').click(); });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var em = document.querySelector('.emblem');
    addEventListener('pointermove', function (e) {
      em.style.setProperty('--tx', (e.clientX / innerWidth - 0.5).toFixed(3));
      em.style.setProperty('--ty', (e.clientY / innerHeight - 0.5).toFixed(3));
    }, { passive: true });
  }
</script>
</body>
