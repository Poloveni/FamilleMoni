<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Membres — {{espace}} · {{nom}}</title>
<meta name="application-name" content="{{nom}}">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="espace.css">
<script src="espace.js"></script>
</head>
<body class="espace-body">

<header class="nav is-scrolled">
  <a class="nav__brand" href="../"><img src="../assets/logo.png" alt="" width="40" height="40"><span>{{nom}}</span></a>
  <nav class="nav__links espace-nav">
    <a href="profil.html">Mon profil</a>
    <a href="membres.html" class="is-active">Membres</a>
    <a href="classement.html">Classement</a>
    <a href="chat.html" id="chatLink">Le Salon<span class="nav__badge" id="chatBadge" hidden></span></a>
    <a href="galerie.html">Galerie</a>
    <div class="nav__group" id="gestion" hidden>
      <button class="nav__group-btn" type="button" aria-expanded="false">Gestion <i>▾</i></button>
      <div class="nav__menu">
        <a href="admin.html">Administration</a>
        <a href="tableau.html">Tableau de bord</a>
        <a href="stats.html">Statistiques</a>
        <a href="taxes.html">Taxes</a>
        <a href="armurerie.html">Armurerie</a>
        <a href="organigramme.html" id="orgLink" hidden>Hiérarchie</a>
      </div>
    </div>
    <a href="../">Le site</a>
    <button class="nav__cta espace-logout" id="logout">Déconnexion</button>
  </nav>
</header>

<main class="espace-page">
  <div class="section__head">
    <span class="numeral">✦</span>
    <h2>Membres</h2>
    <p class="sub">Ceux qui portent les couleurs</p>
  </div>
  <div class="espace-loading" id="loading">Chargement…</div>
  <div class="membres-grid" id="grid"></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  fetch('../api/me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(m => { if (m) espaceNav(m); });
  fetch('../api/membres', { credentials: 'same-origin' })
    .then(r => { if (r.status === 401) { location.replace('./'); throw 0; } if (r.status === 403) { location.replace('attente.html'); throw 0; } return r.json(); })
    .then(list => {
      $('loading').hidden = true;
      $('grid').innerHTML = list.map(m => `
        <article class="miembro" data-featured="${m.rankFeatured}">
          <img src="${m.avatarUrl || '../assets/favicon.png'}" alt="" width="72" height="72">
          <span class="rank__title">${(m.rankLabel || 'Sans grade').replace(/</g, '&lt;')}</span>
          <span class="miembro__name">${m.displayName.replace(/</g, '&lt;')}</span>
          <span class="miembro__user">@${m.username.replace(/</g, '&lt;')}</span>
        </article>`).join('');
    }).catch(() => {});
  $('logout').addEventListener('click', async () => { await fetch('../auth/logout', { method: 'POST', credentials: 'same-origin' }); location.href = './'; });
</script>
</body>
</html>
