<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liaison avec le bot — Famille Moni</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <meta name="theme-color" content="#0b0c10" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="moni-theme-dash.css?v=11" />
  <!--
    Page de retour du bot Discord (bot-moni-v3). Le bot y renvoie le
    navigateur avec `#token=<jwt>` après la connexion Discord
    (/config site-externe set https://famillemoni.com/suivi-connexion.html).

    Le fragment est lu puis EFFACÉ de la barre d'adresse avant tout autre
    chargement, et le jeton n'est jamais écrit dans localStorage, un cookie ou
    l'historique : il part directement vers l'Edge Function `bot-suivi`.

    Deux cas :
      • une session du site est déjà ouverte → action `link` : le jeton est
        vérifié (même compte Discord, même serveur) puis rangé côté serveur ;
      • aucune session → action `login` : c'est LA connexion au site. La
        passerelle vérifie le jeton auprès du bot, retrouve (ou crée) le
        compte du site portant cet identifiant Discord, et renvoie un lien
        magique à usage unique que cette page échange contre une session.
  -->
  <script>
    // Tout de suite, avant supabase-js et avant tout rendu : on capture et on nettoie.
    (function () {
      var h = window.location.hash || '';
      var m = /(?:^#|[#&])token=([^&]+)/.exec(h);
      window.__botToken = m ? decodeURIComponent(m[1]) : null;
      if (h) history.replaceState(null, '', window.location.pathname + window.location.search);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; background: var(--bg, #0b0c10); color: var(--text, #eef0f4); }
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
    .card.narrow { width: 100%; max-width: 460px; padding: 34px 30px; box-sizing: border-box; }
    .etat { display: flex; align-items: center; gap: 12px; margin: 18px 0 6px; font-size: 15.5px; line-height: 1.6; }
    .etat .spin { width: 18px; height: 18px; border: 2px solid var(--border2, #444); border-top-color: var(--paper, #e9dfc9); border-radius: 50% !important; animation: rot .9s linear infinite; flex-shrink: 0; }
    @keyframes rot { to { transform: rotate(360deg); } }
    .etat.ok b { color: #6fd79a; }
    .etat.err b { color: #e0a0a0; }
    .detail { font-size: 14px; color: var(--dim, #8b91a0); line-height: 1.6; margin-top: 8px; }
    .actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
    .ro { font-family: var(--caps, serif); font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim, #8b91a0); margin-top: 26px; text-align: center; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="card narrow" role="status" aria-live="polite">
    <h1 class="auth-title">Espace <span>Membre</span></h1>
    <div class="sub">Connexion par le bot Moni.</div>

    <div class="etat" id="etat"><span class="spin" aria-hidden="true"></span><span id="etat-txt">Vérification en cours…</span></div>
    <div class="detail" id="detail"></div>

    <div class="actions" id="actions" hidden>
      <a class="btn" id="btn-retour" href="espace-membre.html">Ouvrir l'espace membre</a>
      <a class="btn ghost" id="btn-relancer" href="espace-membre.html" hidden>Relancer la liaison</a>
    </div>

    <div class="ro">Lecture seule — gestion sur Discord</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(async function () {
  var etat = document.getElementById('etat');
  var txt = document.getElementById('etat-txt');
  var detail = document.getElementById('detail');
  var actions = document.getElementById('actions');
  var relancer = document.getElementById('btn-relancer');

  function fin(ok, message, extra, titre) {
    etat.querySelector('.spin') && etat.querySelector('.spin').remove();
    etat.classList.add(ok ? 'ok' : 'err');
    txt.innerHTML = '<b>' + (titre || (ok ? 'Compte lié.' : 'Liaison impossible.')) + '</b> ' + message;
    detail.textContent = extra || '';
    actions.hidden = false;
    if (!ok) relancer.hidden = false;
  }

  var token = window.__botToken;
  window.__botToken = null;
  if (!token) {
    fin(false, 'Aucun jeton reçu dans l\'adresse.', 'Cette page est le point de retour du bot après la connexion Discord. Lance la connexion depuis l\'espace membre.', 'Rien à faire.');
    return;
  }

  var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
  var session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
  var FN = window.SUPABASE_URL.replace(/\/$/, '') + '/functions/v1/bot-suivi';
  var connexion = !session;   // pas de session : c'est la connexion au site elle-même
  txt.textContent = connexion ? 'Connexion en cours…' : 'Vérification auprès du bot…';
  try {
    var entetes = { 'Content-Type': 'application/json', apikey: window.SUPABASE_KEY };
    if (session) entetes.Authorization = 'Bearer ' + session.access_token;
    var r = await fetch(FN, { method: 'POST', headers: entetes, body: JSON.stringify({ action: connexion ? 'login' : 'link', token: token }) });
    token = null;
    var d = null;
    try { d = await r.json(); } catch (e) {}
    if (r.ok && d && d.ok) {
      var qui = d.me ? String(d.me.username).replace(/[<>&"]/g, '') : 'toi';
      var droits = d.me && d.me.isAdmin ? ' (administrateur)' : (d.me && d.me.isTaxes ? ' (rôle taxes)' : '');
      if (connexion) {
        // Le lien magique devient une session Supabase — ici, sans passer par un mail.
        var v = await sb.auth.verifyOtp({ type: 'magiclink', token_hash: d.tokenHash });
        if (v.error || !v.data || !v.data.session) { fin(false, 'La session du site n\'a pas pu être ouverte.', String(v.error && v.error.message || ''), 'Connexion impossible.'); return; }
        fin(true, 'Bienvenue, <b>' + qui + '</b>' + droits + '.', d.nouveau ? 'Ton compte vient d\'être créé : un administrateur doit le valider avant que tu voies le tableau de bord.' : 'Ouverture de l\'espace membre…', 'Connecté(e).');
      } else {
        fin(true, 'Connecté au bot en tant que <b>' + qui + '</b>' + droits + '.', 'Retour à l\'espace membre dans un instant…');
      }
      setTimeout(function () { window.location.replace('espace-membre.html'); }, d.nouveau ? 3200 : 1400);
      return;
    }
    var msg = (d && d.message) || ('Réponse inattendue (' + r.status + ').');
    var aide = '';
    switch (d && d.code) {
      case 'not_configured': aide = 'La passerelle du site n\'a pas encore l\'adresse du bot (secrets BOT_API_URL / BOT_GUILD_ID de l\'Edge Function bot-suivi).'; break;
      case 'no_discord_identity': aide = 'Sur l\'espace membre, déconnecte-toi puis reconnecte-toi avec le bouton « Se connecter avec Discord ».'; break;
      case 'mismatch': aide = 'Le compte Discord utilisé pour le bot doit être le même que celui relié à ton compte du site.'; break;
      case 'wrong_guild': aide = 'Le jeton a été émis pour un autre serveur Discord.'; break;
      case 'site_forbidden': aide = 'Ton compte du site doit être approuvé (accès complet) pour utiliser cette rubrique.'; break;
      case 'unavailable': aide = 'Le bot est peut-être arrêté ou son API n\'est pas joignable depuis le site. Réessaie plus tard.'; break;
      case 'reconnect': aide = 'Relance simplement la connexion depuis l\'espace membre.'; break;
      case 'forbidden': aide = 'Il faut être membre du serveur Discord de la famille pour entrer.'; break;
      case 'discord_pris': aide = 'Deux comptes du site pour un même Discord : supprime le doublon (celui en attente) dans le panel admin, puis relance la liaison.'; break;
    }
    fin(false, msg.replace(/[<>&"]/g, ''), aide, connexion ? 'Connexion impossible.' : undefined);
  } catch (e) {
    token = null;
    fin(false, 'La passerelle du site ne répond pas.', String(e && e.message || e));
  }
})();
</script>
</body>
</html>
