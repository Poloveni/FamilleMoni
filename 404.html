<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Famille Moni</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/jpeg" href="/FamilleMoni/logo.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif; background: #0b0c10; color: #eef0f4;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      background-image:
        radial-gradient(700px 400px at 80% -10%, rgba(192,57,43,0.14), transparent 60%),
        radial-gradient(600px 400px at 0% 110%, rgba(212,178,110,0.08), transparent 60%);
    }
    .code {
      font-family: 'Playfair Display', serif; font-style: italic; font-weight: 900;
      font-size: clamp(90px, 22vw, 180px); line-height: 1; color: #c0392b;
      text-shadow: 0 0 60px rgba(192,57,43,0.35);
    }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(20px, 4vw, 30px); margin: 18px 0 10px; }
    p { color: #8b91a0; font-size: 14px; max-width: 420px; margin: 0 auto 30px; line-height: 1.7; }
    a.btn {
      display: inline-block; padding: 13px 30px; background: #c0392b; color: #fff;
      text-decoration: none; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
      font-weight: 600; border-radius: 10px; transition: background 0.2s, transform 0.2s;
    }
    a.btn:hover { background: #a93226; transform: translateY(-2px); }
    .sig { margin-top: 40px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #565c6b; }
    .sig b { color: #d4b26e; }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Cette page a disparu…</h1>
    <p>…comme les traîtres. Personne ne l'a revue depuis, et crois-nous, personne ne posera de questions. Retourne au quartier avant qu'on te remarque.</p>
    <a class="btn" href="/FamilleMoni/">↩ Retour à Roxwood</a>
    <div class="sig">Famille <b>Moni</b> · Flashback FA</div>
  </div>
</body>
</html>
