# ════════════════════════════════════════════════════════════
#  Synchronisation Discord → site (présences + annonces)
#  GitHub exécute ce fichier automatiquement toutes les 5 min :
#  il appelle les deux fonctions Supabase qui lisent Discord.
#  Rien à faire : le fichier agit dès qu'il est publié sur GitHub.
# ════════════════════════════════════════════════════════════
name: Sync Discord vers le site

on:
  schedule:
    - cron: '*/5 * * * *'   # toutes les 5 minutes
  workflow_dispatch:         # + bouton "Run workflow" manuel sur GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Synchroniser les présences
        run: curl -s --max-time 30 https://prwdtdmdkhzwfyivaepw.supabase.co/functions/v1/sync-discord-presences

      - name: Synchroniser les annonces
        run: curl -s --max-time 30 https://prwdtdmdkhzwfyivaepw.supabase.co/functions/v1/sync-discord-annonces
